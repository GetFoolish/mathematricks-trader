services:
  # Python Services
  cerebro-service:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE_NAME: cerebro_service
    volumes:
      - ./services:/app/services
    ports:
      - "5678:5678" # Debug port
      - "8082:8082" # HTTP API endpoint
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - MONGODB_URI=${MONGODB_URI}
      - PYTHONPATH=/app/services/cerebro_service:/app
      - ACCOUNT_DATA_SERVICE_URL=${ACCOUNT_DATA_SERVICE_URL}
      - EXECUTION_SERVICE_URL=http://execution-service:8083
      - USE_MOCK_BROKER=true  # Enable mock broker for staging/testing
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health').read()"]
      interval: 60s
      timeout: 3s
      retries: 20
      start_period: 60s
    command: python -m services.cerebro_service.cerebro_main

  execution-service:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE_NAME: execution_service
    volumes:
      - ./services:/app/services
      - /var/run/docker.sock:/var/run/docker.sock  # For gateway management
    ports:
      - "5679:5679" # Debug port
      - "8083:8083" # Health check endpoint
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - MONGODB_URI=${MONGODB_URI}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health').read()"]
      interval: 60s
      timeout: 3s
      retries: 20
      start_period: 30s
    command: python -m services.execution_service.execution_main

  # Infrastructure Services
  mongodb:
    image: mongo:6.0
    hostname: mongodb
    ports:
      - "27018:27018"
    volumes:
      - mongo_data:/data/db
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27018" ]
    healthcheck:
      test: ["CMD-SHELL", "echo \"try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27018' }] }) }\" | mongosh --port 27018 --quiet"]
      interval: 10s
      timeout: 10s
      retries: 5

  # MongoDB Seed Data Initialization (runs once on first startup)
  mongodb-init:
    image: mongo:6.0
    volumes:
      - ./scripts:/scripts
      - ./seed_data:/seed_data
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["bash", "/scripts/init_mongodb.sh"]
    restart: "no"

  # Signal Ingestion
  signal-ingestion:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE_NAME: signal_ingestion
    volumes:
      - ./services:/app/services
    depends_on:
      mongodb:
        condition: service_healthy
      cerebro-service:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - MONGODB_URI=${MONGODB_URI}
      - CEREBRO_SERVICE_URL=http://cerebro-service:8082
    command: python -m services.signal_ingestion.signal_ingestion_main --staging

  # Portfolio Builder
  portfolio-builder:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE_NAME: portfolio_builder
    volumes:
      - ./services:/app/services
    ports:
      - "8003:8003"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - MONGODB_URI=${MONGODB_URI}
      - PYTHONPATH=/app/services/portfolio_builder:/app
    command: python -m services.portfolio_builder.main

  # Dashboard Creator
  dashboard-creator:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE_NAME: dashboard_creator
    volumes:
      - ./services:/app/services
    ports:
      - "8004:8004"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - MONGODB_URI=${MONGODB_URI}
      - PYTHONPATH=/app/services/dashboard_creator:/app
    command: python -m services.dashboard_creator.dashboard_creator_main

  # Frontend Admin Dashboard
  frontend-admin:
    build:
      context: ./frontend-admin
    ports:
      - "3001:5173"
      - "8000:8000"
    volumes:
      - ./frontend-admin:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000
      - MONGODB_URI=mongodb://mongodb:27018/?replicaSet=rs0
      - API_PORT=8000
    command: sh -c "npm install && npm run dev:all"

  # Frontend Website + Signal Receiver API
  frontend:
    build:
      context: ../mathematricks-website
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - PORT=3000
      - mongodbconnectionstring=mongodb://mongodb:27018/mathematricks_trading?replicaSet=rs0&directConnection=true
      - WEBHOOK_PASSPHRASES=yahoo123,test_password_123
    healthcheck:
      test: ["CMD-SHELL", "netstat -tlnp | grep :3000 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 5s
    command: node server.cjs

volumes:
  mongo_data:
  frontend_node_modules:


networks:
  default:
    name: tradenet
