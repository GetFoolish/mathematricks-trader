version: '3.8'

services:
  # Python Services
  cerebro-service:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE_NAME: cerebro_service
    volumes:
      - ./services:/app/services
    ports:
      - "5678:5678" # Debug port
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - MONGODB_URI=${MONGODB_URI}
      - PYTHONPATH=/app/services/cerebro_service:/app
      - ACCOUNT_DATA_SERVICE_URL=${ACCOUNT_DATA_SERVICE_URL}
      - USE_MOCK_BROKER=true  # Enable mock broker for staging/testing
    command: python -m services.cerebro_service.cerebro_main

  execution-service:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE_NAME: execution_service
    volumes:
      - ./services:/app/services
      - /var/run/docker.sock:/var/run/docker.sock  # For gateway management
    ports:
      - "5679:5679" # Debug port
      - "8083:8083" # Health check endpoint
    depends_on:
      mongodb:
        condition: service_healthy
      account-data-service:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - MONGODB_URI=${MONGODB_URI}
      - ACCOUNT_DATA_SERVICE_URL=${ACCOUNT_DATA_SERVICE_URL}
    command: python -m services.execution_service.execution_main

  account-data-service:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE_NAME: account_data_service
    volumes:
      - ./services:/app/services
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - MONGODB_URI=${MONGODB_URI}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/api/v1/accounts').read()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    command: python -m services.account_data_service.account_data_main

  # Infrastructure Services
  mongodb:
    image: mongo:6.0
    hostname: mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    healthcheck:
      test: ["CMD-SHELL", "echo \"try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }) }\" | mongosh --port 27017 --quiet"]
      interval: 10s
      timeout: 10s
      retries: 5

  # MongoDB Seed Data Initialization (runs once on first startup)
  mongodb-init:
    image: mongo:6.0
    volumes:
      - ./scripts:/scripts
      - ./seed_data:/seed_data
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["bash", "/scripts/init_mongodb.sh"]
    restart: "no"

  # Signal Ingestion
  signal-ingestion:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE_NAME: signal_ingestion
    volumes:
      - ./services:/app/services
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - MONGODB_URI=${MONGODB_URI}
    command: python -m services.signal_ingestion.signal_ingestion_main --staging

  # Portfolio Builder
  portfolio-builder:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE_NAME: portfolio_builder
    volumes:
      - ./services:/app/services
    ports:
      - "8003:8003"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - MONGODB_URI=${MONGODB_URI}
      - PYTHONPATH=/app/services/portfolio_builder:/app
    command: python -m services.portfolio_builder.main

  # Dashboard Creator
  dashboard-creator:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE_NAME: dashboard_creator
    volumes:
      - ./services:/app/services
    ports:
      - "8004:8004"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - MONGODB_URI=${MONGODB_URI}
      - PYTHONPATH=/app/services/dashboard_creator:/app
    command: python -m services.dashboard_creator.dashboard_creator_main

  # Frontend (includes API server)
  frontend:
    build:
      context: ./frontend-admin
    ports:
      - "5173:5173"
      - "8000:8000"
    volumes:
      - ./frontend-admin:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000
      - MONGODB_URI=mongodb://mongodb:27017/?replicaSet=rs0
      - API_PORT=8000
    command: sh -c "npm install && npm run dev:all"

volumes:
  mongo_data:
  frontend_node_modules:


networks:
  default:
    name: tradenet
