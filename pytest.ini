[pytest]
# Pytest Configuration for Mathematricks Trader

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 8.0

# Add current directory to path
pythonpath = .

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    -l
    # Strict markers - must be registered
    --strict-markers
    # Show warnings
    -W default
    # Coverage options (when using pytest-cov)
    # --cov=services
    # --cov-report=html
    # --cov-report=term-missing
    # Timeout for tests (in seconds)
    --timeout=300
    # Color output
    --color=yes
    # Show captured output for failed tests
    --tb=short

# Markers for different test types
markers =
    unit: Unit tests - test individual functions/methods in isolation
    integration: Integration tests - test multiple components working together
    e2e: End-to-end tests - test complete workflows
    slow: Tests that take longer than 10 seconds
    broker: Tests that require broker connection (IBKR, etc)
    database: Tests that require database connection
    docker: Tests that require Docker services running
    smoke: Quick smoke tests to verify basic functionality
    critical: Critical path tests that must pass
    signal_flow: Tests for signal ingestion and processing
    execution: Tests for order execution
    backtest: Tests for backtesting functionality
    regression: Regression tests for known bugs
    skip_ci: Tests to skip in CI/CD pipeline

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:eventkit
    ignore::PendingDeprecationWarning

# Asyncio settings
asyncio_mode = auto

# Timeout settings
timeout_method = thread
